name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix worker

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: |
          npm run typecheck
          npm run typecheck --prefix worker

      - name: Unit tests
        run: npm run test -- --run

      - name: Scan working tree for secrets
        run: |
          if git grep -nIE "sk-ant-[A-Za-z0-9_-]{10,}|api[_-]?key[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9_-]{16,}" -- . ':!package-lock.json' ':!worker/package-lock.json'; then
            echo "::error::Potential secret found in the working tree"
            exit 1
          fi
          echo "No secret patterns found."

      - name: Check build configuration
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Repository variable VITE_API_URL is not set"
            exit 1
          fi

      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
